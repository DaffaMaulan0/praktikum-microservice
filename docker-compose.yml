services:
  gateway:
    build: ./gateway
    ports:
      - '8080:80'
    depends_on:
      mahasiswa-service:
        condition: service_healthy
      matkul-service:
        condition: service_healthy
    restart: unless-stopped

  mahasiswa-service:
    build: ./mahasiswa-service
    expose:
      - '5000'
    environment:
      DATABASE_URL: mysql+pymysql://mhs_user:mhs_pass@mysql-db:3306/mahasiswa_db
      MATKUL_URL: http://matkul-service:5000
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  matkul-service:
    build: ./matkul-service
    expose:
      - '5000'
    environment:
      DATABASE_URL: postgresql+psycopg2://mk_user:mk_pass@postgres-db:5432/matkul_db
      MAHASISWA_URL: http://mahasiswa-service:5000
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mahasiswa_db
      MYSQL_USER: mhs_user
      MYSQL_PASSWORD: mhs_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_DB: matkul_db
      POSTGRES_USER: mk_user
      POSTGRES_PASSWORD: mk_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mk_user -d matkul_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql_data:
  pg_data:
